name: Cukies immutable images

on:
  push:
    branches:
      - staging
      - main
  pull_request:
    branches: [staging, main]

permissions:
  contents: read

concurrency:
  group: cukies-images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-delivery:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify deployment invariants
        run: |
          node scripts/ci/generate-images-compose.mjs --check
          node --test scripts/ci/*.test.mjs scripts/assert-staging-only.test.mjs scripts/assert-production.test.mjs scripts/docker-dapp-server.test.mjs

  build-push-deploy:
    if: github.event_name == 'push' && (github.ref == 'refs/heads/staging' || github.ref == 'refs/heads/main')
    environment: ${{ github.ref_name == 'main' && 'cukies-production' || 'cukies-staging' }}
    runs-on:
      - self-hosted
      - linux
      - x64
      - cukies-builder
    env:
      CUKIES_DEPLOY_ENVIRONMENT: ${{ github.ref_name == 'main' && 'production' || 'staging' }}
      CUKIES_GIT_BRANCH: ${{ github.ref_name }}
      CUKIES_DELIVERY_MODE: ${{ vars.CUKIES_DELIVERY_MODE || 'legacy-images' }}
      CUKIES_REGISTRY: ${{ vars.CUKIES_REGISTRY }}
      CUKIES_REGISTRY_USERNAME: ${{ secrets.CUKIES_REGISTRY_USERNAME }}
      CUKIES_REGISTRY_PASSWORD: ${{ secrets.CUKIES_REGISTRY_PASSWORD }}
      CUKIES_COOLIFY_URL: ${{ vars.CUKIES_COOLIFY_URL }}
      CUKIES_COOLIFY_TOKEN: ${{ secrets.CUKIES_COOLIFY_TOKEN }}
      CUKIES_BUILD_ENV_JSON: ${{ vars.CUKIES_BUILD_ENV_JSON || (github.ref_name == 'staging' && vars.CUKIES_STAGING_BUILD_ENV_JSON) || '' }}
      CUKIES_IMAGE_DEPLOY_ENABLED: ${{ vars.CUKIES_IMAGE_DEPLOY_ENABLED || (github.ref_name == 'staging' && vars.CUKIES_STAGING_IMAGE_DEPLOY_ENABLED) || 'false' }}
      CUKIES_STATE_PATH: /srv/cukies-ci/state/${{ github.ref_name == 'main' && 'production' || 'staging' }}/release.json
      CUKIES_HEALTH_URL: ${{ github.ref_name == 'main' && 'https://cukies.world/api/health' || 'https://cukieshub.eurekand.com/api/health' }}
      BUILDX_BUILDER: cukies-ci

    steps:
      - name: Initialize release directory
        shell: bash
        run: |
          set -euo pipefail
          case "$CUKIES_DELIVERY_MODE" in
            rolling) ;;
            legacy-images) test "$CUKIES_DEPLOY_ENVIRONMENT" = staging ;;
            *) echo "Unsupported CUKIES_DELIVERY_MODE"; exit 1 ;;
          esac
          release_dir="$RUNNER_TEMP/cukies-$CUKIES_DEPLOY_ENVIRONMENT-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir -p "$release_dir"
          echo "CUKIES_RUN_DIR=$release_dir" >> "$GITHUB_ENV"

      - name: Checkout exact push SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate queued run is still the branch tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$CUKIES_GIT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"
          if test -e "$CUKIES_STATE_PATH.pending.json"; then
            echo "Previous delivery requires runtime reconciliation before another build/deploy."
            exit 1
          fi

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 10.19.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.19.0 --activate
          pnpm --version

      - name: Install root graph and Nx
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter nextn install --frozen-lockfile --ignore-scripts
          pnpm exec nx --version

      - name: Validate public build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CUKIES_RUN_DIR"
          node scripts/ci/build-env.mjs --output "$CUKIES_RUN_DIR/build-env.json" | tee "$CUKIES_RUN_DIR/build-env.result.json"
          hash="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).hash)" "$CUKIES_RUN_DIR/build-env.json")"
          echo "CUKIES_BUILD_ENV_HASH=$hash" >> "$GITHUB_ENV"

      - name: Compute affected release plan
        id: plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/generate-images-compose.mjs --check
          node scripts/ci/release-plan.mjs \
            --state "$CUKIES_STATE_PATH" \
            --head "$GITHUB_SHA" \
            --config-hash "$CUKIES_BUILD_ENV_HASH" \
            --output "$CUKIES_RUN_DIR/plan.json"
          node -e 'const fs=require("fs"); const plan=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); fs.appendFileSync(process.env.GITHUB_OUTPUT,`dapp=${plan.build.includes("dapp")}\n`)' "$CUKIES_RUN_DIR/plan.json"

      - name: Verify deployment invariants
        run: node --test scripts/ci/*.test.mjs scripts/assert-staging-only.test.mjs scripts/assert-production.test.mjs scripts/docker-dapp-server.test.mjs

      - name: Validate affected web application
        if: steps.plan.outputs.dapp == 'true'
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter dapp install --frozen-lockfile
          pnpm dapp lint
          pnpm dapp typecheck
          pnpm dapp test --runInBand

      - name: Prepare persistent BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          CUKIES_REGISTRY="$CUKIES_REGISTRY" BUILDX_BUILDER="$BUILDX_BUILDER" scripts/ci/prepare-buildx.sh

      - name: Login to registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CUKIES_REGISTRY_PASSWORD" | docker login "$CUKIES_REGISTRY" --username "$CUKIES_REGISTRY_USERNAME" --password-stdin

      - name: Build and push immutable affected images
        shell: bash
        run: |
          set -euo pipefail
          components="$(node -e "process.stdout.write(JSON.stringify(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).build))" "$CUKIES_RUN_DIR/plan.json")"
          node scripts/ci/build-images.mjs \
            --components "$components" \
            --plan "$CUKIES_RUN_DIR/plan.json" \
            --registry "$CUKIES_REGISTRY" \
            --sha "$GITHUB_SHA" \
            --config-hash "$CUKIES_BUILD_ENV_HASH" \
            --build-env-json "$CUKIES_RUN_DIR/build-env.json" \
            --manifest "$CUKIES_RUN_DIR/manifest.json"

      - name: Revalidate branch tip before deploy
        if: env.CUKIES_IMAGE_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "refs/heads/$CUKIES_GIT_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"

      - name: Bootstrap legacy images deployment
        if: env.CUKIES_IMAGE_DEPLOY_ENABLED == 'true' && env.CUKIES_DELIVERY_MODE == 'legacy-images' && env.CUKIES_DEPLOY_ENVIRONMENT == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/coolify-release.mjs \
            --manifest "$CUKIES_RUN_DIR/manifest.json" \
            --compose docker-compose.images.yml \
            --result "$CUKIES_RUN_DIR/deploy-result.json"

      - name: Persist bootstrap release state atomically
        if: env.CUKIES_IMAGE_DEPLOY_ENABLED == 'true' && env.CUKIES_DELIVERY_MODE == 'legacy-images' && env.CUKIES_DEPLOY_ENVIRONMENT == 'staging'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/release-state.mjs \
            --state "$CUKIES_STATE_PATH" \
            --manifest "$CUKIES_RUN_DIR/manifest.json" \
            --health-sha "$GITHUB_SHA"

      - name: Deliver web and affected workers
        if: env.CUKIES_IMAGE_DEPLOY_ENABLED == 'true' && env.CUKIES_DELIVERY_MODE == 'rolling'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/deliver-release.mjs \
            --manifest "$CUKIES_RUN_DIR/manifest.json" \
            --state "$CUKIES_STATE_PATH" \
            --compose docker-compose.workers.yml \
            --result "$CUKIES_RUN_DIR/deploy-result.json"

      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cukies-${{ env.CUKIES_DEPLOY_ENVIRONMENT }}-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cukies-${{ env.CUKIES_DEPLOY_ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}/plan.json
            ${{ runner.temp }}/cukies-${{ env.CUKIES_DEPLOY_ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}/build-env.json
            ${{ runner.temp }}/cukies-${{ env.CUKIES_DEPLOY_ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            ${{ runner.temp }}/cukies-${{ env.CUKIES_DEPLOY_ENVIRONMENT }}-${{ github.run_id }}-${{ github.run_attempt }}/deploy-result.json
          if-no-files-found: warn
