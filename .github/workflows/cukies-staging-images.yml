name: Cukies staging immutable images

on:
  push:
    branches:
      - staging

permissions:
  contents: read

concurrency:
  group: cukies-staging-images
  cancel-in-progress: false

jobs:
  build-push-deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/staging'
    environment: cukies-staging
    runs-on:
      - self-hosted
      - linux
      - x64
      - cukies-builder
    env:
      CUKIES_REGISTRY: ${{ vars.CUKIES_REGISTRY }}
      CUKIES_REGISTRY_USERNAME: ${{ secrets.CUKIES_REGISTRY_USERNAME }}
      CUKIES_REGISTRY_PASSWORD: ${{ secrets.CUKIES_REGISTRY_PASSWORD }}
      CUKIES_COOLIFY_URL: ${{ vars.CUKIES_COOLIFY_URL }}
      CUKIES_COOLIFY_TOKEN: ${{ secrets.CUKIES_COOLIFY_TOKEN }}
      CUKIES_STAGING_BUILD_ENV_JSON: ${{ vars.CUKIES_STAGING_BUILD_ENV_JSON }}
      CUKIES_STAGING_IMAGE_DEPLOY_ENABLED: ${{ vars.CUKIES_STAGING_IMAGE_DEPLOY_ENABLED || 'false' }}
      CUKIES_STATE_PATH: /srv/cukies-ci/state/staging/release.json
      CUKIES_HEALTH_URL: https://cukieshub.eurekand.com/api/health
      BUILDX_BUILDER: cukies-ci
      CUKIES_RUN_DIR: ${{ runner.temp }}/cukies-staging-${{ github.run_id }}-${{ github.run_attempt }}

    steps:
      - name: Checkout exact push SHA
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.sha }}

      - name: Validate queued run is still the staging tip
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/staging
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup pnpm 10.19.0
        shell: bash
        run: |
          set -euo pipefail
          corepack enable
          corepack prepare pnpm@10.19.0 --activate
          pnpm --version

      - name: Install root graph and Nx
        shell: bash
        run: |
          set -euo pipefail
          pnpm --filter nextn install --frozen-lockfile --ignore-scripts
          pnpm exec nx --version

      - name: Validate public staging build environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$CUKIES_RUN_DIR"
          node scripts/ci/build-env.mjs --output "$CUKIES_RUN_DIR/build-env.json" | tee "$CUKIES_RUN_DIR/build-env.result.json"
          hash="$(node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).hash)" "$CUKIES_RUN_DIR/build-env.json")"
          echo "CUKIES_BUILD_ENV_HASH=$hash" >> "$GITHUB_ENV"

      - name: Compute affected release plan
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/generate-images-compose.mjs --check
          node scripts/ci/release-plan.mjs \
            --state "$CUKIES_STATE_PATH" \
            --head "$GITHUB_SHA" \
            --config-hash "$CUKIES_BUILD_ENV_HASH" \
            --output "$CUKIES_RUN_DIR/plan.json"

      - name: Prepare persistent BuildKit builder
        shell: bash
        run: |
          set -euo pipefail
          CUKIES_REGISTRY="$CUKIES_REGISTRY" BUILDX_BUILDER="$BUILDX_BUILDER" scripts/ci/prepare-buildx.sh

      - name: Login to staging registry
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$CUKIES_REGISTRY_PASSWORD" | docker login "$CUKIES_REGISTRY" --username "$CUKIES_REGISTRY_USERNAME" --password-stdin

      - name: Build and push immutable affected images
        shell: bash
        run: |
          set -euo pipefail
          components="$(node -e "process.stdout.write(JSON.stringify(JSON.parse(require('fs').readFileSync(process.argv[1],'utf8')).build))" "$CUKIES_RUN_DIR/plan.json")"
          node scripts/ci/build-images.mjs \
            --components "$components" \
            --plan "$CUKIES_RUN_DIR/plan.json" \
            --registry "$CUKIES_REGISTRY" \
            --sha "$GITHUB_SHA" \
            --config-hash "$CUKIES_BUILD_ENV_HASH" \
            --build-env-json "$CUKIES_RUN_DIR/build-env.json" \
            --manifest "$CUKIES_RUN_DIR/manifest.json"

      - name: Revalidate staging tip before deploy
        if: env.CUKIES_STAGING_IMAGE_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin refs/heads/staging
          test "$(git rev-parse FETCH_HEAD)" = "${GITHUB_SHA}"

      - name: Deploy immutable compose through Coolify API
        if: env.CUKIES_STAGING_IMAGE_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/coolify-release.mjs \
            --manifest "$CUKIES_RUN_DIR/manifest.json" \
            --compose docker-compose.images.yml \
            --result "$CUKIES_RUN_DIR/deploy-result.json"

      - name: Persist successful release state atomically
        if: env.CUKIES_STAGING_IMAGE_DEPLOY_ENABLED == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/ci/release-state.mjs \
            --state "$CUKIES_STATE_PATH" \
            --manifest "$CUKIES_RUN_DIR/manifest.json" \
            --health-sha "$GITHUB_SHA"

      - name: Upload deployment manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cukies-staging-release-${{ github.sha }}
          path: |
            ${{ runner.temp }}/cukies-staging-${{ github.run_id }}-${{ github.run_attempt }}/plan.json
            ${{ runner.temp }}/cukies-staging-${{ github.run_id }}-${{ github.run_attempt }}/build-env.json
            ${{ runner.temp }}/cukies-staging-${{ github.run_id }}-${{ github.run_attempt }}/manifest.json
            ${{ runner.temp }}/cukies-staging-${{ github.run_id }}-${{ github.run_attempt }}/deploy-result.json
          if-no-files-found: warn
