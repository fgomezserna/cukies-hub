      test: ["CMD-SHELL", "node -e \"fetch('${CUKIES_WEB_URL:?Set CUKIES_WEB_URL}/api/health').then(async(r)=>{const b=await r.json();process.exit(r.ok&&b?.coolify?.resourceUuid===process.env.CUKIES_WEB_RESOURCE_UUID?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - coolify

  reward-batch-publisher:
    image: "${CUKIES_IMAGE_DAPP:?Set CUKIES_IMAGE_DAPP to an immutable digest reference}"
    profiles:
      - staging-runtime
    command:
      - sh
      - -c
      - node scripts/assert-staging-only.mjs --scope economy-scheduler && exec node dapp/scripts/reward-batch-publisher.mjs
    environment:
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in Coolify environment variables}
      STAGING_ONLY_GUARD: ${STAGING_ONLY_GUARD:?Set STAGING_ONLY_GUARD=true for staging}
      COOLIFY_BRANCH: ${COOLIFY_BRANCH:?Set COOLIFY_BRANCH=staging}
      CUKIES_WEB_RESOURCE_UUID: ${CUKIES_WEB_RESOURCE_UUID:?Set CUKIES_WEB_RESOURCE_UUID}
      COOLIFY_RESOURCE_UUID: ${COOLIFY_RESOURCE_UUID:?Set the staging resource UUID}
      DATABASE_URL: ${DATABASE_URL}
      CHAIN_INDEXER_MONGO_URL: ${CHAIN_INDEXER_MONGO_URL:-${DATABASE_URL}}
      CHAIN_INDEXER_DB_NAME: ${CHAIN_INDEXER_DB_NAME:-cukieshub-new}
      CHAIN_INDEXER_BSC_EXPECTED_CHAIN_ID: ${CHAIN_INDEXER_BSC_EXPECTED_CHAIN_ID:-56}
      CHAIN_INDEXER_BSC_RPC_URL: ${CHAIN_INDEXER_BSC_RPC_URL:-${BSC_RPC_URL:-}}
      BSC_RPC_URL: ${BSC_RPC_URL:-}
      CHAIN_INDEXER_REWARDS_DISTRIBUTOR_ADDRESS: ${CHAIN_INDEXER_REWARDS_DISTRIBUTOR_ADDRESS:-${NEXT_PUBLIC_UKI_REWARDS_DISTRIBUTOR_ADDRESS:-}}
      NEXT_PUBLIC_UKI_CHAIN_ID: ${NEXT_PUBLIC_UKI_CHAIN_ID:-56}
      NEXT_PUBLIC_UKI_TOKEN_ADDRESS: ${NEXT_PUBLIC_UKI_TOKEN_ADDRESS:-}
      NEXT_PUBLIC_UKI_REWARDS_DISTRIBUTOR_ADDRESS: ${NEXT_PUBLIC_UKI_REWARDS_DISTRIBUTOR_ADDRESS:-}
      REWARD_BATCH_PUBLISHER_ENABLED: ${REWARD_BATCH_PUBLISHER_ENABLED:-false}
      REWARD_BATCH_PUBLISHER_ID: ${REWARD_BATCH_PUBLISHER_ID:-coolify-staging-primary}
      REWARD_BATCH_PUBLISHER_INTERVAL_MS: ${REWARD_BATCH_PUBLISHER_INTERVAL_MS:-60000}
      REWARD_BATCH_PUBLISHER_LEASE_MS: ${REWARD_BATCH_PUBLISHER_LEASE_MS:-300000}
      REWARD_BATCH_PUBLISHER_CONFIRMATIONS: ${REWARD_BATCH_PUBLISHER_CONFIRMATIONS:-12}
      REWARD_BATCH_CLAIM_WINDOW_SECONDS: ${REWARD_BATCH_CLAIM_WINDOW_SECONDS:-7776000}
      REWARD_BATCH_PUBLISHER_EXPECTED_SIGNER_ADDRESS: ${REWARD_BATCH_PUBLISHER_EXPECTED_SIGNER_ADDRESS:-}
      REWARD_BATCH_PUBLISHER_PRIVATE_KEY: ${REWARD_BATCH_PUBLISHER_PRIVATE_KEY:-}
      REWARD_BATCH_PUBLISHER_RUN_ONCE: "false"
    depends_on:
      chain-indexer:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('${CUKIES_WEB_URL:?Set CUKIES_WEB_URL}/api/health').then(async(r)=>{const b=await r.json();process.exit(r.ok&&b?.coolify?.resourceUuid===process.env.CUKIES_WEB_RESOURCE_UUID?0:1)}).catch(()=>process.exit(1))\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 90s
    networks:
      - coolify

  cuki-card-worker:
    image: "${CUKIES_IMAGE_CUKI_CARD_WORKER:?Set CUKIES_IMAGE_CUKI_CARD_WORKER to an immutable digest reference}"
    profiles:
      - card-worker
    environment:
      CUKIES_SERVICE: cuki-card-worker
      NODE_ENV: production
      APP_ENV: ${APP_ENV:?Set APP_ENV in Coolify environment variables}
      STAGING_ONLY_GUARD: ${STAGING_ONLY_GUARD:?Set STAGING_ONLY_GUARD=true for staging}
      COOLIFY_BRANCH: ${COOLIFY_BRANCH:?Coolify must expose the staging branch}
      COOLIFY_RESOURCE_UUID: ${COOLIFY_RESOURCE_UUID:?Coolify must expose the staging resource UUID}
      DATABASE_URL: ${DATABASE_URL}
      CARD_WORKER_MONGO_URL: ${CARD_WORKER_MONGO_URL:-${DATABASE_URL}}
      CARD_WORKER_DB_NAME: ${CARD_WORKER_DB_NAME:-cukieshub-new}
      CARD_WORKER_UPLOAD: ${CARD_WORKER_UPLOAD:-false}
      CARD_WORKER_PUBLIC_BASE_URL: ${CARD_WORKER_PUBLIC_BASE_URL}
      CARD_WORKER_S3_BUCKET: ${CARD_WORKER_S3_BUCKET}
      CARD_WORKER_S3_REGION: ${CARD_WORKER_S3_REGION}
      CARD_WORKER_S3_PREFIX: ${CARD_WORKER_S3_PREFIX}
      CARD_WORKER_S3_ENDPOINT: ${CARD_WORKER_S3_ENDPOINT:-}
