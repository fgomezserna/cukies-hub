# LXC 2007: independent staging instance; existing mongod:27017 is unchanged.
storage:
  dbPath: /var/lib/cukies-staging-mongodb
  wiredTiger:
    engineConfig:
      cacheSizeGB: 0.5
systemLog:
  destination: file
  logAppend: true
  path: /var/log/cukies-staging-mongodb/mongod.log
net:
  port: 27018
  bindIp: 127.0.0.1,192.168.1.221
security:
  authorization: enabled
  keyFile: /etc/mongodb-cukies-staging.keyfile
replication:
  replSetName: cukies-staging-rs0
  oplogSizeMB: 256
processManagement:
  timeZoneInfo: /usr/share/zoneinfo
